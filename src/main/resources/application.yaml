server:
  # 8080은 VMware 네트워크 서비스(vmnat.exe)가 쓰고 있어서 8081을 쓴다.
  port: 8081
  # 이 PC는 공인 IP라서 외부에서 직접 접속하지 못하게 이 PC 안에서만 연다. (프론트는 Vite 프록시로 접근)
  address: 127.0.0.1

spring:
  application:
    name: ddobak
  datasource:
    url: jdbc:h2:file:./data/ddobak
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

ddobak:
  ocr:
    # 하루 글자 인식 횟수 상한 (Google Vision 무료 월 1,000번 안에 들도록 30번)
    daily-limit: ${OCR_DAILY_LIMIT:30}
    google:
      # PC 환경 변수에서만 읽는다. 비어 있으면 가짜 응답을 쓴다. 키를 이 파일에 직접 쓰지 말 것!
      api-key: ${GOOGLE_VISION_API_KEY:}
