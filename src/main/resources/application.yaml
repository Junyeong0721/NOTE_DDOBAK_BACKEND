server:
  # 8080은 VMware 네트워크 서비스(vmnat.exe)가 쓰고 있어서 8081을 쓴다.
  port: 8081

spring:
  application:
    name: ddobak
  datasource:
    url: jdbc:h2:file:./data/ddobak
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
